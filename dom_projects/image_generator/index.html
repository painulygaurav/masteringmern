<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shape Generator</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="container shape-generator w-50 bg-light p-4 rounded">
      <!-- Row 1: Select shape, number of shape, and shape color -->
      <div class="row g-3 justify-content-center">
        <!-- Shape Type -->
        <div class="col-md-3">
          <select
            id="shapeType"
            class="form-select"
            aria-label="Shape type"
            required
          >
            <option value="" disabled selected>Select a shape type</option>
            <option value="circle">Circle</option>
            <option value="square">Square</option>
          </select>
        </div>

        <!-- Shape Count -->
        <div class="col-md-3">
          <input
            class="form-control"
            type="number"
            id="shapeCount"
            placeholder="Number of shapes"
            aria-label="Number of shapes"
            min="1"
            required
          />
        </div>

        <!-- Shape Color -->
        <div class="col-md-3">
          <input
            class="form-control"
            type="color"
            id="shapeColor"
            value="#3498db"
            aria-label="Shape color"
          />
        </div>
      </div>

      <!-- Row 2: Generate, and Clear button -->
      <div class="row g-3 mt-3 justify-content-center">
        <div class="col-md-3">
          <button
            type="button"
            class="btn btn-primary w-100"
            data-action="generate"
          >
            Generate
          </button>
        </div>

        <div class="col-md-3">
          <button
            type="button"
            class="btn btn-primary w-100"
            data-action="clear-shapes"
          >
            Clear
          </button>
        </div>
      </div>
    </div>

    <div
      class="container shape-container w-50 bg-light p-4 rounded justify-content-center"
    ></div>
    <script src="./script.js"></script>
  </body>
</html>
